<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HoloCommerce - Your Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .cart-container {
      max-width: 700px;
      margin: auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .item h3 {
      margin: 0;
    }

    .item button {
      background: #f44336;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .summary {
      margin-top: 20px;
      font-size: 18px;
      text-align: center;
    }

    .summary span {
      font-weight: bold;
      color: #0ff;
    }

    #checkout {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #00c853;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #checkout:hover {
      background: #00b44a;
    }
  </style>
</head>
<body>
  <h1>Your HoloCart</h1>
  <div class="cart-container" id="cartItems"></div>
  <div class="summary" id="summary"></div>
  <button id="checkout" onclick="goToOrder()">Proceed to Order</button>

  <script>
    const cartContainer = document.getElementById("cartItems");
    const summary = document.getElementById("summary");

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderCart() {
      cartContainer.innerHTML = "";
      if (cart.length === 0) {
        cartContainer.innerHTML = "<p>Your cart is empty.</p>";
        summary.textContent = "";
        return;
      }

      cart.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <h3>${item.name}</h3>
          <p>₹${item.price}</p>
          <button onclick="removeItem(${index})">Remove</button>
        `;
        cartContainer.appendChild(div);
      });

      const subtotal = cart.reduce((sum, p) => sum + p.price, 0);
      summary.innerHTML = `Subtotal: <span>₹${subtotal}</span>`;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    function goToOrder() {
      window.location.href = "order.html"; // Or wherever your order page is
    }

    renderCart();
  </script>
</body>
</html>
