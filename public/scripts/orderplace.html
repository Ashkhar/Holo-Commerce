<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoloCommerce - Extraordinary Order Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: url('bg12.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #E0E0E0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
      padding: 30px;
      max-width: 500px;
      width: 100%;
      animation: fadeIn 1.5s ease;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4A90E2;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #357ABD;
      transform: scale(1.05);
    }

    .carousel {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .carousel img {
      height: 100px;
      border-radius: 10px;
      transition: transform 0.3s;
    }

    .carousel img:hover {
      transform: scale(1.1);
    }

    #loader {
      display: none;
      text-align: center;
      margin-bottom: 15px;
    }

    #themeToggle {
      margin-bottom: 20px;
      background: #888;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
    }

    /* Light Mode */
    body.light-mode {
      background: #f5f5f5;
      color: #333;
    }

    body.light-mode .container {
      background: rgba(255, 255, 255, 0.7);
      color: #000;
    }

    body.light-mode input, 
    body.light-mode select {
      background: rgba(0, 0, 0, 0.1);
      color: #000;
    }

    body.light-mode button {
      background: #333;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <button id="themeToggle">🌗 Toggle Theme</button>

    <h1>HoloCommerce</h1>

    

    <div id="loader">⏳ Placing your order...</div>

    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" />
    </div>
    <div class="form-group">
      <label for="address">Address</label>
      <input type="text" id="address" placeholder="Delivery address" />
    </div>
    <div class="form-group">
      <label for="city">City</label>
      <input type="text" id="city" placeholder="City name" />
    </div>
    <div class="form-group">
      <label for="pincode">Pincode</label>
      <input type="text" id="pincode" placeholder="Pincode" />
    </div>
    <div class="form-group">
      <label for="payment">Payment Method</label>
      <select id="payment">
        <option value="cod">Cash on Delivery</option>
        <option value="upi">UPI</option>
        <option value="card">Credit/Debit Card</option>
      </select>
    </div>
    <div class="form-group">
      <label for="coupon">Coupon Code (optional)</label>
      <input type="text" id="coupon" placeholder="Enter coupon code" />
    </div>
    <button onclick="placeOrder()">Place Order</button>
  </div>

  <script>
    const products = [
      { name: 'HoloPhone X1', price: 1500 },
      { name: 'AR Headset', price: 2500 }
    ];

    const themeBtn = document.getElementById("themeToggle");
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
    });

    async function placeOrder() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const address = document.getElementById("address").value;
      const city = document.getElementById("city").value;
      const pincode = document.getElementById("pincode").value;
      const payment = document.getElementById("payment").value;
      const coupon = document.getElementById("coupon").value.trim();
      const loader = document.getElementById("loader");

      if (!name || !email || !address || !city || !pincode) {
        alert("Please fill all the details.");
        return;
      }

      const subtotal = products.reduce((sum, p) => sum + p.price, 0);
      let discount = 0;

      if (coupon.toLowerCase() === "holo50") {
        discount = 0.5 * subtotal;
      }

      const total = subtotal - discount;

      const orderData = {
        name, email, address, city, pincode, payment, products, subtotal, discount, total, coupon
      };

      try {
        loader.style.display = "block";

        const response = await fetch("http://localhost:5000/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(orderData)
        });

        loader.style.display = "none";
        const result = await response.json();

        if (response.ok) {
          const msg = new SpeechSynthesisUtterance(`Order placed successfully! Your total is ₹${result.total || total}`);
          speechSynthesis.speak(msg);
          alert(`Order placed successfully! Total: ₹${result.total || total}`);
        } else {
          alert("Order failed: " + result.error);
        }
      } catch (err) {
        loader.style.display = "none";
        alert("Error placing order.");
      }
    }
  </script>
</body>
</html>
